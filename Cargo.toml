
[package]
name = "metatrader-rs"
version = "0.1.1"
edition = "2021"
license = "MIT"
readme = "README.md"
rust-version = "1.70"
documentation = "https://docs.rs/metatrader-rs"
categories = ["api-bindings", "finance"]
authors = ["Cowan K. Wekesa <cowannwekesa@gmail.com>"]
keywords = ["metatrader", "mt5", "trading", "forex", "ipc"]
description = "A pure Rust library for MetaTrader 5 IPC communication (no Python dependency)"

[lib]
name = "metatrader_rs"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.47.5", features = ["full"] }
windows-sys = { version = "0.59", features = [
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
